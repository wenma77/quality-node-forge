# Sources are intentionally quality-focused.
# Supported input formats:
# - Clash/Mihomo YAML with a top-level "proxies" list.
# - Plain URI subscriptions containing vless://, trojan://, vmess://, ss://, hysteria2://.
# - Base64-encoded URI subscriptions.
sources:
  - name: Au1rxx verified feed
    url: https://raw.githubusercontent.com/Au1rxx/free-vpn-subscriptions/main/output/clash.yaml
    weight: 1.35
    enabled: true
    notes: "Hourly feed, sing-box real HTTP verification before publishing."

  - name: VovaplusEXP VLESS secure
    url: https://raw.githubusercontent.com/VovaplusEXP/p-configs/main/Clash-Profiles/vless.yaml
    weight: 1.18
    enabled: true
    notes: "Speed-tested Clash Meta profile, secure VLESS set."

  - name: VovaplusEXP Trojan
    url: https://raw.githubusercontent.com/VovaplusEXP/p-configs/main/Clash-Profiles/trojan.yaml
    weight: 1.12
    enabled: true
    notes: "Speed-tested Clash Meta profile, Trojan set."

  - name: VovaplusEXP Shadowsocks
