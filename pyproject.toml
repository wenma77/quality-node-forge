[project]
name = "quality-node-forge"
version = "0.1.0"
description = "Curated Clash/Mihomo proxy quality filter using real mihomo delay checks."
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27.0",
  "PyYAML>=6.0.1",
]

[project.scripts]
quality-node-forge = "quality_node_forge.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
