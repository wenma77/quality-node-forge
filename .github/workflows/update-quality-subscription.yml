name: Update quality subscription

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

concurrency:
  group: quality-node-forge-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e .

      - name: Generate quality subscription
        run: |
          python -m quality_node_forge run \
            --candidate-limit 717 \
            --top 30 \
            --rounds 3 \
            --workers 24 \
            --timeout-ms 5000 \
            --max-delay-ms 1800 \
            --max-jitter-ms 700 \
            --min-success-rate 1.0

      - name: Validate generated Mihomo config
        run: |
          chmod +x tools/mihomo/mihomo
          tools/mihomo/mihomo -t -d runtime -f outputs/quality.yaml

      - name: Commit updated subscription
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add outputs/quality.yaml outputs/quality-provider.yaml outputs/report.md outputs/tested.json
          if git diff --cached --quiet; then
            echo "No output changes to commit."
          else
            git commit -m "chore: update quality subscription"
            git push
          fi
