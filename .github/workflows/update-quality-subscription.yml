name: 更新高质量订阅

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

concurrency:
  group: quality-node-forge-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: 拉取仓库
        uses: actions/checkout@v4

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e .

      - name: 生成高质量订阅
        run: |
          python -m quality_node_forge run \
            --candidate-limit 500 \
            --output-limit 8 \
            --top 8 \
            --rounds 3 \
            --workers 24 \
            --timeout-ms 3000 \
            --max-delay-ms 1200 \
            --max-jitter-ms 300 \
            --min-success-rate 1.0 \
            --min-winners 1

      - name: 校验 Mihomo 配置
        run: |
          chmod +x tools/mihomo/mihomo
          tools/mihomo/mihomo -t -d runtime -f outputs/quality.yaml

      - name: 提交更新后的订阅
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add outputs/quality.yaml outputs/quality-provider.yaml outputs/strict.yaml outputs/strict-provider.yaml outputs/report.md outputs/tested.json
          if git diff --cached --quiet; then
            echo "No output changes to commit."
          else
            git commit -m "chore: update quality subscription"
            git push
          fi
